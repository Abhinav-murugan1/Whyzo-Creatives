# Build settings live in the repo so a deploy cannot drift from what is tested locally.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 / rolldown needs >= 20.19; pin so Netlify's rolling default cannot break a deploy
  NODE_VERSION = "22"

# Vite fingerprints every file in /assets, so the content can never change behind a given URL.
# Cache them for a year and skip revalidation entirely on repeat visits.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts and icons are stable but not fingerprinted - a day of caching with revalidation.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# The HTML shell carries the asset hashes, so it must never be served stale.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# SPA fallback. public/_redirects says the same thing; this keeps it visible alongside the build config.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
